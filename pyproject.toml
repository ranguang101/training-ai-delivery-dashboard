[project]
name = "training-ai-efficiency"
version = "0.1.0"
description = "培训机构 AI 提效方案"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "itsdangerous>=2.2,<3.0",
  "jinja2>=3.1,<4.0",
  "markdown>=3.8,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "bcrypt>=4.0,<5.0",
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0,<7.0",
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "data", "node_modules", "test-results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
