<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>工作区 | 项目交付看板</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/project-status.css') }}?v=safe-workspaces-r1">
  </head>
  <body data-dashboard-mode="read_only_local">
    <header class="topbar">
      <div>
        <h1>项目交付看板</h1>
      </div>
      <div class="topbar-actions">
        {% include "_project_nav.html" %}
        <div class="sync-panel" aria-live="polite">
          <span class="sync-dot"></span>
          <div><strong id="sync-status">自动同步中</strong><span>仅显示安全摘要</span></div>
        </div>
      </div>
    </header>

    <main>
      <section class="safe-workspace-hero" aria-labelledby="safe-workspace-title">
        <div>
          <h2 id="safe-workspace-title">工作区</h2>
          <p>按负责人查看当前状态、下一步、开放门禁和已核对证据。这里不展示原始交接、报告、路径、环境或业务数据。</p>
        </div>
      </section>

      <section class="section-block safe-workspace-section" aria-labelledby="safe-workspace-list-title">
        <div class="section-heading">
          <div><h2 id="safe-workspace-list-title">安全协作摘要</h2></div>
          <p>缺失信息会明确标记为待核对，不根据历史状态推断结论。</p>
        </div>
        <div data-safe-workspace-overview aria-live="polite" aria-busy="true">
          <p class="safe-workspace-loading">正在加载工作区安全摘要…</p>
        </div>
      </section>
    </main>

    <footer><span>仅显示经服务端安全投影批准的协作信息。</span></footer>
    <script src="{{ url_for('static', path='/project-status.js') }}?v=safe-workspaces-r1" defer></script>
  </body>
</html>
