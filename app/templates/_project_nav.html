{% set current_path = request.url.path %}
{% set is_overview = current_path == "/project-status" %}
{% set is_workspace = current_path.startswith("/project-status/workspaces") %}
<div class="project-nav-stack">
  <nav class="console-nav console-nav-primary" aria-label="项目一级导航">
    <a class="{% if is_overview %}is-active{% endif %}" data-r3-nav="overview" href="/project-status">项目总览</a>
    <a class="{% if is_workspace %}is-active{% endif %}" data-r3-nav="workspace" href="/project-status/workspaces">工作区</a>
  </nav>

  {% if is_workspace %}
  <nav class="console-subnav" aria-label="工作区二级导航">
    <a class="{% if current_path == '/project-status/workspaces' %}is-active{% endif %}" href="/project-status/workspaces">协作总览</a>
    <a class="{% if current_path == '/project-status/workspaces/development' %}is-active{% endif %}" href="/project-status/workspaces/development">服务端工作区</a>
    <a class="{% if current_path == '/project-status/workspaces/frontend' %}is-active{% endif %}" href="/project-status/workspaces/frontend">前端工作区</a>
    <a class="{% if current_path == '/project-status/workspaces/testing' %}is-active{% endif %}" href="/project-status/workspaces/testing">质量工作区</a>
  </nav>
  {% endif %}
</div>
